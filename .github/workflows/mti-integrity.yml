name: MTI Integrity

on:
  push:
    branches: [mti-development]
  pull_request:
    branches: [mti-development]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Syntax check
        shell: bash
        run: |
          set -e
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check server.js
